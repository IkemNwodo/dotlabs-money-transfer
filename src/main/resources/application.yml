server:
  port: 8080

spring:
  application:
    name: dotlabs-money-transfer
  datasource:
    url: jdbc:h2:mem:moneytransferdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# Scheduling configurations (can be overridden via environment variables)
app:
  scheduling:
    # Runs at 01:00 AM every day by default
    commission-cron: "0 0 1 * * ?"
    # Runs at 02:00 AM every day by default
    summary-cron: "0 0 2 * * ?"

# Actuator configuration for Kubernetes readiness & liveness probes
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# OpenAPI / Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
