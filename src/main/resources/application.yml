server:
  port: 8080

spring:
  application:
    name: dotlabs-money-transfer
  datasource:
    url: jdbc:h2:mem:moneytransferdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Application-specific security and scheduling configurations
app:
  jwt:
    # 256-bit base64/hex secret for HS256 JWT signing
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  otp:
    expiration-seconds: 300 # 5 minutes
    max-attempts: 3
  scheduling:
    commission-cron: "0 0 1 * * ?"
    summary-cron: "0 0 2 * * ?"

# Actuator configuration for Kubernetes readiness & liveness probes
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# OpenAPI / Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
