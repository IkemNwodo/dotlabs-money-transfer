apiVersion: apps/v1
kind: Deployment
metadata:
  name: money-transfer-deployment
  labels:
    app: money-transfer-service
spec:
  replicas: 3 # Running multiple instances in cluster as per DotLabs requirements
  selector:
    matchLabels:
      app: money-transfer-service
  template:
    metadata:
      labels:
        app: money-transfer-service
    spec:
      containers:
        - name: money-transfer-service
          image: dotlabs/money-transfer-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: money-transfer-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
